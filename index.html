<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport">
    <script src="game.js" defer></script>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

    <title>FightingGame</title>
</head>
<body>
    <div class = "game-container">
        <canvas id = "game-screen" width="1024" height="576" style="border: 1px solid black;">
        </canvas>

        <div class = "health-bar-container">
            <div id = "p1healthborder">
                <div id = "p1health"></div>
            </div>
            <div id = "p2healthborder">
                <div id = "p2health"></div>
            </div>
            <div id = "timer"></div>
        </div>

        <div class = "game-loss">
            <div id = "playeroneloss">GAME OVER. PLAYER 2 WINS!</div>
            <div id = "playertwoloss">GAME OVER. PLAYER 1 WINS!</div>
        </div>
    </div>
</body>
